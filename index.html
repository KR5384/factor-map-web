<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>デプロイ確認</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f9fafb;
            color: #1f2937;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .success-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 24px;
            margin: 0 0 12px 0;
            color: #059669;
        }
        p {
            margin: 0 0 24px 0;
            color: #6b7280;
            line-height: 1.5;
        }
        .time {
            font-size: 14px;
            color: #9ca3af;
            background: #f3f4f6;
            padding: 8px;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="success-icon">🚀</div>
        <h1>デプロイ成功！</h1>
        <p>Cloudflare Pagesへの連携が正常に完了し、<br>新しいドメインで表示されています。</p>
        <div class="time">
            更新を確認するためには、<br>このページをリロードしてください。
        </div>
    </div>
</body>
</html>
