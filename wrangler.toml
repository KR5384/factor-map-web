# Cloudflare Workers 設定: もやもや診断アプリ 画面配信 (静的アセット専用)
# 参照: design.md「Architecture」
# NOTE: API は factor-map-api (別リポジトリ / 別 Worker) に集約した (A案)。
#       このリポジトリは Vite ビルド成果物 (dist) を配信する画面専用。
name = "factor-map-web"
compatibility_date = "2025-01-01"

# 静的アセット配信 (画面表示用)。`npm run build` の出力先 dist を配信する。
# この設定によりデプロイ時に has_assets = true となる。
# - directory: Vite のビルド出力 (vite.config.ts の build.outDir と一致)
# - not_found_handling: SPA 向けに未知パスは index.html へフォールバック
# API を自前で持たないため run_worker_first は不要 (全リクエストをアセットで処理)。
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
